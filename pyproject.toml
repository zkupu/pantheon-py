[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pantheon"
version = "0.2.0"
description = "Agentic AI toolkit with tool use, multi-agent orchestration, and pipelines."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zachary Kupu"}]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
dev = ["build>=1.2", "mypy>=1.10", "pip-tools>=7.0", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "types-PyYAML>=6.0", "types-requests>=2.31"]

[project.scripts]
pantheon = "pantheon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pantheon"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "pantheon/_bundled_skills"

[tool.hatch.build.targets.sdist]
include = [
    "/.agents/skills/**",
    "/scripts/**",
    "/src/pantheon/**",
    "/tests/**",
    "/docs/**",
    "/evals/**",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/pyproject.toml",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pantheon"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pantheon --cov-report=term-missing --cov-fail-under=40"
